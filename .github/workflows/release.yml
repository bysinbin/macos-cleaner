name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests
        run: |
          go test -short ./...

      - name: Build Universal macOS Binary and App Bundle
        run: |
          chmod +x scripts/build-macos-app.sh
          ./scripts/build-macos-app.sh "${{ steps.vars.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: DiskCleaner Pro ${{ steps.vars.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/*.zip
            build/*.tar.gz
            build/checksums.txt
